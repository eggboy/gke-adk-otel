apiVersion: v1
kind: Namespace
metadata:
  name: adk-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adk-demo-sa
  namespace: adk-demo
  annotations:
    # Bind to a Google service account with roles/aiplatform.user,
    # roles/telemetry.tracesWriter, roles/logging.logWriter,
    # roles/monitoring.metricWriter, and roles/storage.objectUser on the
    # bucket (the upload hook needs objects.get + list; see README step 2).
    iam.gke.io/gcp-service-account: adk-demo-gsa@${PROJECT_ID}.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adk-demo-agent
  namespace: adk-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adk-demo-agent
  template:
    metadata:
      labels:
        app: adk-demo-agent   # must match the Instrumentation CR selector
    spec:
      serviceAccountName: adk-demo-sa
      containers:
        - name: agent
          image: ${LOCATION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/adk-demo-agent:latest
          ports:
            - containerPort: 8080
          env:
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "TRUE"
            - name: GOOGLE_CLOUD_PROJECT
              value: ${PROJECT_ID}
            - name: GOOGLE_CLOUD_LOCATION
              value: ${LOCATION}
            - name: OTEL_SERVICE_NAME
              value: adk-demo-agent
            # Message content handling. With multimodal capture the content goes
            # to GCS (upload hook) and the span/log carry gen_ai.*_ref pointers.
            # NO_CONTENT keeps the base64 image out of the log record: Cloud
            # Logging rejects any attribute > 64 KB, so EVENT_ONLY would make
            # the whole GenAI log entry (and its _ref link) get dropped for
            # real-size images. Valid values: NO_CONTENT, SPAN_ONLY, EVENT_ONLY,
            # SPAN_AND_EVENT (never "true").
            - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
              value: NO_CONTENT
            # Still emit the gen_ai.client.inference.operation.details log event
            # (it is otherwise only emitted in *_EVENT modes).
            - name: OTEL_INSTRUMENTATION_GENAI_EMIT_EVENT
              value: "true"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: adk-demo-agent
  namespace: adk-demo
spec:
  selector:
    app: adk-demo-agent
  ports:
    - port: 80
      targetPort: 8080
